name: Create Addon Package

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  ADDON_NAME: LettuceTracker

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create package directory
        run: mkdir -p "package/${ADDON_NAME}"

      - name: Copy addon files
        run: |
          cp LettuceTracker.toc "package/${ADDON_NAME}/"
          cp icon.tga "package/${ADDON_NAME}/"
          cp Core.lua "package/${ADDON_NAME}/"
          cp Database.lua "package/${ADDON_NAME}/"
          cp Commands.lua "package/${ADDON_NAME}/"
          cp -r Modules "package/${ADDON_NAME}/"
          cp -r UI "package/${ADDON_NAME}/"

      - name: Create zip
        working-directory: package
        run: |
          zip -r "${ADDON_NAME}-${{ github.event.release.tag_name }}.zip" "${ADDON_NAME}"

      - name: Upload zip to release
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "package/${ADDON_NAME}-${{ github.event.release.tag_name }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}